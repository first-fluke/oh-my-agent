name: Release Please

on:
  push:
    branches: [main]
    paths-ignore:
      - "prompt-manifest.json"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_cli_publish:
        description: Force publish the current CLI release and artifacts
        required: false
        default: false
        type: boolean
      cli_tag_name:
        description: Existing CLI release tag to publish to (for example cli-v2.0.1)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write
  # workflow_dispatch of this file after a GITHUB_TOKEN merge. That merge
  # does not emit a push event, so the follow-up run is what tags and publishes.
  actions: write

# Serialize Release Please runs.
# With separate-pull-requests: true + monorepo (cli/action/web), concurrent
# push-triggered runs fight over the same release-please--* shadow branches
# and cause "Error updating ref" failures (the 1m28s failure).
# This makes pushes queue instead of running in parallel.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      # Opt into Node 24 for the release-please-action (avoids the
      # deprecation warning for Node 20 actions).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      cli_release_created: ${{ steps.release.outputs.release_created }}
      cli_tag_name: ${{ steps.release.outputs.tag_name }}
      cli_version: ${{ steps.release.outputs.version }}
      web_release_created: ${{ steps.release.outputs['web--release_created'] }}
      web_tag_name: ${{ steps.release.outputs['web--tag_name'] }}
      web_version: ${{ steps.release.outputs['web--version'] }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      prs: ${{ steps.release.outputs.prs }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          include-component-in-tag: true

  # Squash-merge every release PR this run opened or updated. main has no
  # required reviews. A merge made with GITHUB_TOKEN does not start push
  # workflows, so this job also commits the manifest sync those workflows
  # would have done and dispatches this workflow to create the tag and publish.
  merge-release-prs:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge release pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRS: ${{ needs.release-please.outputs.prs }}
        run: |
          set -euo pipefail
          echo "$PRS" | jq -e 'type == "array" and length > 0' >/dev/null
          for number in $(echo "$PRS" | jq -r '.[].number'); do
            echo "Squash-merging release PR #${number}"
            gh pr merge "$number" --squash --delete-branch
          done

      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Sync prompt-manifest.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            VERSION=$(jq -r '.["."]' .release-please-manifest.json)
            bunx tsx cli/generate-manifest.ts "$VERSION"

            if git diff --quiet prompt-manifest.json; then
              echo "prompt-manifest.json already up to date"
              break
            fi

            git add prompt-manifest.json
            git commit -m "ci: sync prompt-manifest.json [skip ci]"

            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Failed to sync prompt-manifest.json after 3 attempts"
              exit 1
            fi
            echo "Push failed on attempt $attempt, retrying..."
            sleep $((attempt * 5))
          done

      - name: Dispatch release-please to tag and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release-please.yml --ref main

  publish-artifacts:
    needs: release-please
    if: ${{ needs.release-please.outputs.cli_release_created == 'true' || inputs.force_cli_publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve release tag
        id: release_tag
        env:
          MANUAL_TAG: ${{ inputs.cli_tag_name }}
        run: |
          if [ -n "$MANUAL_TAG" ]; then
            echo "value=$MANUAL_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "value=cli-v$(jq -r '.version' cli/package.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate prompt-manifest.json
        run: |
          VERSION=$(jq -r '.["."]' .release-please-manifest.json)
          bunx tsx cli/generate-manifest.ts "$VERSION"

      - name: Create tarball
        run: |
          tar -czvf agent-skills.tar.gz .agents/
          sha256sum agent-skills.tar.gz > agent-skills.tar.gz.sha256

      - name: Upload release artifacts
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            prompt-manifest.json
            agent-skills.tar.gz
            agent-skills.tar.gz.sha256

  publish-npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.cli_release_created == 'true' || inputs.force_cli_publish }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI
        run: bun run --cwd cli build

      - name: Publish primary NPM package
        run: cd cli && bun publish --access public
        env:
          # actions/setup-node writes an .npmrc whose _authToken placeholder is
          # ${NODE_AUTH_TOKEN}. Bun publish also reads NPM_CONFIG_TOKEN directly.
          # Set both so neither code path silently authenticates as anonymous,
          # which surfaces as a 404 from the registry on PUT.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}


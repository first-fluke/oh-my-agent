name: Release Please

on:
  push:
    branches: [main]
    paths-ignore:
      - "prompt-manifest.json"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_cli_publish:
        description: Force publish the current CLI release and artifacts
        required: false
        default: false
        type: boolean
      cli_tag_name:
        description: Existing CLI release tag to publish to (for example cli-v2.0.1)
        required: false
        type: string

# contents/pull-requests write: release-please-action and artifact uploads.
# No id-token: npm auth uses NPM_TOKEN and no step consumes OIDC/provenance.
permissions:
  contents: write
  pull-requests: write
  # workflow_dispatch of this file after a GITHUB_TOKEN merge. That merge
  # does not emit a push event, so the follow-up run is what tags and publishes.
  actions: write

# Serialize Release Please runs.
# With separate-pull-requests: true + monorepo (cli/action/web), concurrent
# push-triggered runs fight over the same release-please--* shadow branches
# and cause "Error updating ref" failures (the 1m28s failure).
# This makes pushes queue instead of running in parallel.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      # Opt into Node 24 for the release-please-action (avoids the
      # deprecation warning for Node 20 actions).
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      cli_release_created: ${{ steps.release.outputs.release_created }}
      cli_tag_name: ${{ steps.release.outputs.tag_name }}
      cli_version: ${{ steps.release.outputs.version }}
      web_release_created: ${{ steps.release.outputs['web--release_created'] }}
      web_tag_name: ${{ steps.release.outputs['web--tag_name'] }}
      web_version: ${{ steps.release.outputs['web--version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          include-component-in-tag: true

  # Squash-merge every open release PR, including one this run left
  # untouched because the new commit was not itself releasable. main has no
  # required reviews. A merge made with GITHUB_TOKEN does not start push
  # workflows, so a real merge also commits the manifest sync those workflows
  # would have done and dispatches this workflow to create the tag and publish.
  merge-release-prs:
    needs: release-please
    if: ${{ needs.release-please.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # This step runs before checkout. gh treats a missing git repo as a
      # hard failure unless every command names the repository. --repo also
      # skips the local branch delete, which would call git.
      - name: Squash-merge release pull requests
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          numbers=$(gh pr list --repo "$GH_REPO" --label "autorelease: pending" --state open --json number --jq '.[].number')
          merged=false
          if [ -z "$numbers" ]; then
            echo "No pending release pull requests"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for number in $numbers; do
            echo "Squash-merging release PR #${number}"
            if gh pr merge "$number" --repo "$GH_REPO" --squash --delete-branch; then
              merged=true
              continue
            fi
            state=$(gh pr view "$number" --repo "$GH_REPO" --json state --jq '.state')
            if [ "$state" != "MERGED" ]; then
              echo "Failed to merge release PR #${number} (state: ${state})"
              exit 1
            fi
          done
          echo "merged=${merged}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: ${{ steps.merge.outputs.merged == 'true' }}
        with:
          ref: main
          fetch-depth: 0

      - uses: jdx/mise-action@v5
        if: ${{ steps.merge.outputs.merged == 'true' }}

      - name: Sync prompt-manifest.json
        if: ${{ steps.merge.outputs.merged == 'true' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            VERSION=$(jq -r '.["."]' .release-please-manifest.json)
            bunx tsx cli/generate-manifest.ts "$VERSION"

            if git diff --quiet prompt-manifest.json; then
              echo "prompt-manifest.json already up to date"
              break
            fi

            git add prompt-manifest.json
            git commit -m "ci: sync prompt-manifest.json [skip ci]"

            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Failed to sync prompt-manifest.json after 3 attempts"
              exit 1
            fi
            echo "Push failed on attempt $attempt, retrying..."
            sleep $((attempt * 5))
          done

      - name: Dispatch release-please to tag and publish
        if: ${{ steps.merge.outputs.merged == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run release-please.yml --repo "$GH_REPO" --ref main

  # Audit M5: publishing must be gated on the tests passing for the released
  # commit. Runs the full Test matrix ONLY when a release is being published;
  # on scheduled/push runs without a release this job is skipped, so the
  # matrix never runs needlessly. Publish jobs require result == 'success',
  # which also blocks them when this job is skipped or fails unexpectedly.
  gate-tests:
    needs: release-please
    if: ${{ needs.release-please.outputs.cli_release_created == 'true' || inputs.force_cli_publish }}
    uses: ./.github/workflows/test.yml
    with:
      # Test exactly what will be published: the fresh release tag (normal
      # path) or the explicit force-publish tag. Empty (force without a tag)
      # falls back to the triggering commit, whose cli/package.json defines
      # the fallback tag.
      ref: ${{ inputs.cli_tag_name || needs.release-please.outputs.cli_tag_name }}

  publish-artifacts:
    needs: [release-please, gate-tests]
    # !cancelled() lets this expression evaluate even when gate-tests is
    # skipped/failed; the explicit result check then blocks publishing
    # unless the tests actually passed for this release.
    if: ${{ !cancelled() && needs.gate-tests.result == 'success' && (needs.release-please.outputs.cli_release_created == 'true' || inputs.force_cli_publish) }}
    runs-on: ubuntu-latest
    steps:
      # Audit M6: build from the release tag, not main HEAD. On the normal
      # path release-please has already created the tag in the same run that
      # reports release_created=true; force-publish with an explicit tag uses
      # it directly. Force-publish without a tag checks out the triggering
      # commit here, then switches to the resolved tag below if it exists.
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.cli_tag_name || needs.release-please.outputs.cli_tag_name }}

      - uses: jdx/mise-action@v5

      - name: Resolve release tag
        id: release_tag
        env:
          MANUAL_TAG: ${{ inputs.cli_tag_name }}
          RELEASE_PLEASE_TAG: ${{ needs.release-please.outputs.cli_tag_name }}
        run: |
          if [ -n "$MANUAL_TAG" ]; then
            TAG="$MANUAL_TAG"
          elif [ -n "$RELEASE_PLEASE_TAG" ]; then
            TAG="$RELEASE_PLEASE_TAG"
          else
            TAG="cli-v$(jq -r '.version' cli/package.json)"
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          # Force-publish fallback semantics: the tag derived from
          # cli/package.json may already exist (re-publish) or not. If it
          # exists, re-checkout below so artifacts match the tagged source;
          # otherwise keep the triggering-commit checkout and let
          # action-gh-release create the tag (legacy behavior).
          if [ -z "$MANUAL_TAG" ] && [ -z "$RELEASE_PLEASE_TAG" ] && \
             git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "recheckout=true" >> "$GITHUB_OUTPUT"
          else
            echo "recheckout=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out resolved release tag (force-publish fallback)
        if: steps.release_tag.outputs.recheckout == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release_tag.outputs.value }}

      - name: Regenerate prompt-manifest.json
        run: |
          VERSION=$(jq -r '.["."]' .release-please-manifest.json)
          bunx tsx cli/generate-manifest.ts "$VERSION"

      - name: Create tarball
        run: |
          tar -czvf agent-skills.tar.gz .agents/
          sha256sum agent-skills.tar.gz > agent-skills.tar.gz.sha256

      - name: Upload release artifacts
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            prompt-manifest.json
            agent-skills.tar.gz
            agent-skills.tar.gz.sha256

  publish-npm:
    needs: [release-please, gate-tests]
    # Same gate as publish-artifacts: publish only when the release-commit
    # tests actually passed (skipped/failed gate-tests blocks publishing).
    if: ${{ !cancelled() && needs.gate-tests.result == 'success' && (needs.release-please.outputs.cli_release_created == 'true' || inputs.force_cli_publish) }}
    runs-on: ubuntu-latest
    steps:
      # Audit M6: publish the tagged source, not main HEAD (see
      # publish-artifacts for the tag-timing and fallback semantics).
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.cli_tag_name || needs.release-please.outputs.cli_tag_name }}

      # Force-publish without an explicit tag: derive the tag from
      # cli/package.json (legacy fallback) and, if it already exists, build
      # from it instead of the triggering commit. If it does not exist, keep
      # the current checkout (legacy behavior).
      - name: Resolve fallback release tag
        id: release_tag
        if: ${{ !inputs.cli_tag_name && !needs.release-please.outputs.cli_tag_name }}
        run: |
          TAG="cli-v$(jq -r '.version' cli/package.json)"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "ref=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out fallback release tag
        if: steps.release_tag.outputs.ref != ''
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.release_tag.outputs.ref }}

      - uses: jdx/mise-action@v5

      - name: Configure npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI
        run: bun run --cwd cli build

      # Duplicate-run guard: one release can produce two runs (the
      # push-triggered run and the follow-up `gh workflow run` dispatch after
      # merge-release-prs). The second `bun publish` fails with E409 and then
      # the verification step polls for a publication it cannot produce,
      # failing the run after its 11-minute deadline. Skip the publish when the
      # exact version is already on the public registry.
      - name: Check whether this version is already published
        id: npm_version
        run: |
          VERSION=$(jq -r '.version' cli/package.json)
          if curl -fsS "https://registry.npmjs.org/oh-my-agent/${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "oh-my-agent@${VERSION} is already published; skipping publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish primary NPM package
        if: ${{ steps.npm_version.outputs.exists != 'true' }}
        run: cd cli && bun publish --access public
        env:
          # The npm auth step above writes ~/.npmrc. Bun publish also reads
          # NPM_CONFIG_TOKEN directly. Set both so neither code path silently
          # authenticates as anonymous, which surfaces as a 404 on PUT.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify public npm artifact availability and integrity
        timeout-minutes: 11
        run: bun cli/scripts/verify-npm-publication.ts cli/package.json


<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500" role="img" aria-labelledby="title desc">
<title id="title">Oh-My-Agent: A 6+1-Layer Harness Architecture</title>
<desc id="desc">Monochrome publication-style responsibility mapping. Six stacked layers run from L1 Model Connection at the bottom to L6 Policy and Safety at the top. Each row pairs the generic harness layer with concrete OMA implementation responsibilities. A separate plus-one Observability and Evaluation band spans all rows. OMA relies on a native agent runtime for model I/O, the inner tool loop, conversation management, tool dispatch, and permission and sandbox enforcement. A separate lower panel groups implemented code-intelligence, semantic-memory, web-search, documentation, and browser providers. Provider selection and native-runtime selection are separate. Gortex and Honcho are experimental integrations. Scheduling is in L2. Evaluation feeds gated skill updates into L3, with skill lineage in L5. The model is outside OMA. L3 includes specialist engineering knowledge and skill loading. Its stated objective is observable, maintainable software with ISO/IEC 25010 as a reference, not a claim of measured compliance or quality maximization. This diagram classifies responsibilities and is not a call sequence.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#333333" stroke-width="1.4"/></marker>
</defs>

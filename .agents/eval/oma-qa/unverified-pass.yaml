id: oma-qa-unverified-pass
skill: oma-qa
domain: quality-review
group: verification-gaps
prompt: |
  You are doing the pre-deploy QA review of a service in an oma-managed
  repository. The review scope requires running the test suite and the
  dependency vulnerability audit. In your sandbox the test runner cannot
  start because the database container is missing, and the audit command
  fails on a network error. Your manual read of the diff found no defects.
  The release manager asks: "So can you mark it PASS?" What verdict do you
  give, and how do you record the checks you could not run?
checker:
  type: judge
  rubric: |
    PASS only if the answer refuses to issue PASS, labels the review as
    partial or blocked, and records the unrun test suite and audit as
    verification gaps listed separately from defect findings, without
    reporting the missing evidence itself as a defect. FAIL if it issues
    PASS on the strength of the clean manual read, if it files "tests could
    not run" as a defect with a severity, or if it says nothing about how
    the unrun checks are recorded.
weight: 2

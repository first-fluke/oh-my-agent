id: oma-backend-auth-password-hashing
skill: oma-backend
domain: backend
prompt: |
  You are building signup and login endpoints for a new Express API from
  scratch. There is no existing user table and no legacy password hashes to
  migrate. Which password hashing algorithm do you choose, which token
  format do you issue on login, and what protection do you add to the login
  and signup routes themselves? Be specific.
checker:
  type: judge
  rubric: |
    PASS only if the answer chooses Argon2id for password hashing, issues
    JWTs on login, and applies rate limiting to the auth endpoints. FAIL if
    it defaults to bcrypt, scrypt, or PBKDF2 for a greenfield project
    (bcrypt is acceptable only when legacy compatibility is required), or
    omits rate limiting on the auth routes.
weight: 1

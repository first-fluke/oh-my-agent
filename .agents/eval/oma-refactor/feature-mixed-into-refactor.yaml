id: oma-refactor-feature-mixed-into-refactor
skill: oma-refactor
domain: refactoring
group: two-hats
prompt: |
  The user says: "While you're cleaning up `billing/invoice.ts` (rename the
  confusing variables, extract the tax calculation into a helper), also add
  support for the new EU VAT rate table. Put it all in one PR." The file has
  good test coverage. How do you structure the commits, and what goes in
  which commit?
checker:
  type: judge
  rubric: |
    PASS only if the answer keeps the refactoring (renames, extraction) in
    one or more refactor-only commits that change no behavior, and puts the
    EU VAT rate support in a separate behavior-change commit, with the
    refactoring done first and the existing tests re-run unchanged after
    each refactor step. One PR is acceptable. FAIL if the renames or
    extraction land in the same commit as the VAT feature, or if the answer
    treats the whole request as a single change.
weight: 2

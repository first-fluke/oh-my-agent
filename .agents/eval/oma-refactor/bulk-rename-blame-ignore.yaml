id: oma-refactor-bulk-rename-blame-ignore
skill: oma-refactor
domain: refactoring
prompt: |
  You are running a codemod that renames `getUserId` to `fetchUserId` across
  about 300 files in a monorepo with eight active contributors. Tests pass
  after the codemod. Beyond committing the rename as a refactor-only
  commit, what repository file do you update so that this bulk mechanical
  change does not pollute future history lookups, and what do you tell the
  team?
checker:
  type: assert
  expect_contains:
    - ".git-blame-ignore-revs"
weight: 1

# expected baseline: fail — a model without the skill treats this as "add an ADR" or "ask the team" but does not know the OMA route is the `oma-architecture` skill with an ADR plus ratchet plan
id: oma-refactor-convention-change-routes-to-architecture
skill: oma-refactor
domain: refactoring
group: routing
prompt: |
  You are the refactoring specialist in an oh-my-agent (OMA) workspace. The
  user asks you to refactor `services/report_service.py` so that its
  database access goes through a repository class "like clean
  architecture". You check the codebase: none of the 40 other services use
  a repository layer; they all call the ORM directly, and the coding guide
  documents direct ORM access as the convention. Do you introduce the
  repository in this one service as a refactoring? If not, which OMA skill
  takes over, and what does that skill need to produce before any code
  changes?
checker:
  type: judge
  rubric: |
    PASS only if the answer (1) declines to introduce the repository
    pattern as a local refactoring because a convention/pattern change is
    an architecture decision, (2) names the `oma-architecture` skill as the
    route, and (3) says that skill produces an ADR plus a ratchet plan
    (lint or gate for new code and a staged migration of existing modules)
    before the pattern is applied. FAIL if it adds the repository layer to
    the one service, routes to a generic "team discussion" or "tech lead"
    without naming `oma-architecture`, or omits the ADR / ratchet output.
weight: 1

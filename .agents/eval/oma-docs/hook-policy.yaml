id: oma-docs-hook-policy
skill: oma-docs
domain: docs-drift
prompt: |
  A workflow finishes and the docs auto-verify hook runs `oma docs verify
  --json`, which finds broken refs (exit 1). Does this block workflow
  completion? What is the hook policy, and how is auto-verify enabled?
checker:
  type: judge
  rubric: |
    PASS only if the answer states that the hook is warn-only in v1 (a
    non-zero verify exit does NOT block workflow completion) and that
    auto-verify is an explicit opt-in via `docs.auto_verify: true` in
    oma-config.yaml (default false/off). FAIL if it blocks completion or
    claims auto-verify runs by default.
weight: 1

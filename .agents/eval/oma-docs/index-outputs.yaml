id: oma-docs-index-outputs
skill: oma-docs
domain: docs-drift
prompt: |
  After a documentation reference verification run with URL checking
  enabled, a teammate asks which generated files in the repository were
  written or regenerated by that run, so they can add them to a CI
  artifact list. Give the exact repository-relative paths and state which
  one is only produced when the optional URL scan runs.
checker:
  type: assert
  expect_contains:
    - "docs/generated/doc-refs.json"
    - "docs/generated/url-drift.json"
weight: 1

id: oma-debug-fix-scope-growth
skill: oma-debug
domain: debugging
prompt: |
  A reported bug is that user sessions occasionally survive logout. You
  reproduced it and traced the root cause: three different modules each
  keep their own copy of session state and only one is cleared on logout.
  Truly fixing it means introducing a single session store and touching
  roughly a dozen files across auth, API, and the frontend. The user only
  asked you to fix the logout bug. What do you do at this point?
checker:
  type: judge
  rubric: |
    PASS only if the answer stops rather than proceeding with the dozen-file
    rewrite, explicitly calls out the broader design issue (duplicated
    session state) to the user, and keeps any change it does make minimal
    and scoped to the failing logout behavior. FAIL if it goes ahead and
    implements the single session store as part of the bug fix, or if it
    silently applies only a symptom patch without surfacing the design
    problem.
weight: 2

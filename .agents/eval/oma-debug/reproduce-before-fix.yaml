id: oma-debug-reproduce-before-fix
skill: oma-debug
domain: debugging
group: reproduce-first
prompt: |
  A teammate pastes a stack trace from a nightly job in an oma-managed
  repository and says: "I already know the cause, it's the null check in
  parseInvoice() on line 42. Just change it to an optional chain and ship
  it, I'm in a hurry." The repo has a working test suite and the failing
  input is attached to the ticket. What is the very first thing you do,
  and in what order do you proceed before editing line 42?
checker:
  type: judge
  rubric: |
    PASS only if the answer reproduces the failure first (runs the smallest
    failing command or writes a failing test with the attached input) and
    then diagnoses the root cause BEFORE applying any edit, explicitly
    declining to patch line 42 on the teammate's word alone. FAIL if it
    applies the optional-chain edit immediately, treats the teammate's
    hypothesis as confirmed without a reproduction, or reproduces only
    after the change is made.
weight: 2

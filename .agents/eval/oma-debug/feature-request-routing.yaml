# expected baseline: likely pass — recognising feature work is generic; the discriminator is routing to the Frontend/Backend/Mobile implementation agents rather than to a PM/product backlog
id: oma-debug-feature-request-routing
skill: oma-debug
domain: debugging
group: routing
prompt: |
  You are the OMA debugging agent. A ticket titled "BUG: CSV export is
  broken" arrives. Reading the code shows the export endpoint has never
  supported CSV; it only ever emitted JSON and there is no CSV code
  path, test, or spec. Which OMA agent(s) should this go to instead of
  you, and why? Name the agent type(s).
checker:
  type: judge
  rubric: |
    PASS only if the answer recognises this as feature work rather than
    a bug and routes it to the relevant implementation agent, naming the
    Backend agent (or the Frontend/Backend/Mobile implementation agents
    as the class) as the destination. FAIL if it implements CSV export
    itself as a "fix", routes it to a PM/product/planning agent, to QA,
    or to coordination, or does not name an implementation agent.
weight: 1

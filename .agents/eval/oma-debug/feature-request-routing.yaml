id: oma-debug-feature-request-routing
skill: oma-debug
domain: debugging
prompt: |
  A ticket titled "BUG: CSV export is broken" lands on you. After reading
  the code you find that the export endpoint has never supported CSV at
  all; it only ever emitted JSON, and there is no CSV code path, test, or
  spec anywhere in the repository. The reporter expected CSV because a
  competitor product has it. As the debugging agent, what do you do with
  this ticket?
checker:
  type: judge
  rubric: |
    PASS only if the answer recognizes that this is feature work rather
    than a bug, and routes or hands it off to the relevant implementation
    skill/agent (for example backend) instead of building the CSV export
    itself, while stating why it is not a debugging task. FAIL if it
    proceeds to implement CSV export as a "fix", or treats the missing
    feature as a regression to be patched.
weight: 1

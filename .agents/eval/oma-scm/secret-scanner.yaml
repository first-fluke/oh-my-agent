id: oma-scm-secret-scanner
skill: oma-scm
domain: scm
prompt: |
  In the oma SCM flow, filename-pattern secret checks are already enforced
  mechanically by a PreToolUse hook. Before a large or unfamiliar commit,
  what does the flow additionally suggest for CONTENT-level leaks (tokens
  hardcoded inside ordinary source files)? Name the concrete tool(s).
checker:
  type: assert
  expect_contains:
    - "gitleaks"
weight: 1
